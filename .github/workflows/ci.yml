name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main


jobs:
  test-and-build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16

        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ecommerce_db

        ports:
          - 5432:5432

        options: >-
          --health-cmd="pg_isready -U postgres -d ecommerce_db"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

      redis:
        image: redis:7-alpine

        ports:
          - 6379:6379

        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=10


    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/ecommerce_db
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/ecommerce_test_db
      REDIS_URL: redis://localhost:6379/0
      REDIS_CACHE_TTL: 300

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7


      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"


      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt


      - name: Create test database
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d postgres -c "CREATE DATABASE ecommerce_test_db;"


      - name: Run database migrations
        run: |
          alembic upgrade head


      - name: Run tests
        run: |
          pytest -v


      - name: Build Docker image
        run: |
          docker build -t ecommerce-api .