on:
  push:
    branches:
      - main
      - feature/shopping-cart

  pull_request:
    branches:
      - main


jobs:
  test-and-build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16

        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ecommerce_db

        ports:
          - 5432:5432

        options: >-
          --health-cmd="pg_isready -U postgres -d ecommerce_db"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

      redis:
        image: redis:7-alpine

        ports:
          - 6379:6379

        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=10


    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/ecommerce_db
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/ecommerce_test_db
      REDIS_URL: redis://localhost:6379/0
      REDIS_CACHE_TTL: "300"
      JWT_SECRET_KEY: "ci-only-jwt-signing-key-never-use-in-production-1234567890"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7


      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"


      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt


      - name: Create test database
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d postgres -c "CREATE DATABASE ecommerce_test_db;"


      - name: Run database migrations
        run: |
          alembic upgrade head


      - name: Run tests
        run: |
          pytest -v


      - name: Build Docker image
        run: |
          docker build -t ecommerce-api .



  compose-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read

    env:
      COMPOSE_PROJECT_NAME: smoke-${{ github.run_id }}-${{ github.run_attempt }}
      COMPOSE_FILE: compose.yaml:compose.monitoring.yaml
      GRAFANA_ADMIN_PASSWORD: ci-only-grafana-password-not-for-production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Create CI-only Compose configuration
        shell: bash
        run: |
          cat > .env.compose <<'EOF'
          POSTGRES_PASSWORD=ci_smoke_password
          DATABASE_URL=postgresql+psycopg://postgres:ci_smoke_password@postgres:5432/ecommerce_db
          TEST_DATABASE_URL=postgresql+psycopg://postgres:ci_smoke_password@postgres:5432/ecommerce_test_db
          REDIS_URL=redis://redis:6379/0
          REDIS_CACHE_TTL=300
          JWT_SECRET_KEY=ci-only-smoke-test-signing-key-never-use-in-production-1234567890
          JWT_ALGORITHM=HS256
          ACCESS_TOKEN_EXPIRE_MINUTES=30
          EOF

      - name: Validate Compose configuration
        run: docker compose --env-file .env.compose config --quiet
      - name: Validate release image configuration
        env:
          API_IMAGE: ghcr.io/sambala98/ecommerce-devops-platform:configuration-check
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          import subprocess

          result = subprocess.run(
              [
                  "docker", "compose",
                  "--env-file", ".env.compose",
                  "-f", "compose.yaml",
                  "-f", "compose.release.yaml",
                  "config", "--format", "json",
              ],
              check=True,
              capture_output=True,
              text=True,
          )

          api = json.loads(result.stdout)["services"]["api"]
          assert api["image"] == os.environ["API_IMAGE"], (
              "Release configuration did not select the requested image."
          )
          assert not api.get("build"), (
              "Release configuration must not build from local source."
          )
          print("Release selects the requested image without a local build.")
          PY

      - name: Build and wait for healthy services
        run: |
          docker compose --env-file .env.compose up \
            --build --wait --wait-timeout 180

      - name: Check HTTP health endpoints
        run: |
          curl --fail --show-error --silent --max-time 10 \
            http://127.0.0.1:8000/health
          curl --fail --show-error --silent --max-time 10 \
            http://127.0.0.1:8000/health/database

      - name: Verify migrations, test database, and Redis
        shell: bash
        run: |
          docker compose --env-file .env.compose exec -T api python - <<'PY'
          import os

          from alembic.config import Config
          from alembic.runtime.migration import MigrationContext
          from alembic.script import ScriptDirectory
          from redis import Redis
          from sqlalchemy import create_engine, text

          scripts = ScriptDirectory.from_config(Config("alembic.ini"))
          expected_heads = set(scripts.get_heads())

          engine = create_engine(os.environ["DATABASE_URL"])
          with engine.connect() as connection:
              actual_heads = set(
                  MigrationContext.configure(connection).get_current_heads()
              )

          assert actual_heads == expected_heads, (
              f"Migration mismatch: actual={actual_heads}, "
              f"expected={expected_heads}"
          )
          engine.dispose()
          print("Application database is at migration head.")

          test_engine = create_engine(os.environ["TEST_DATABASE_URL"])
          with test_engine.connect() as connection:
              assert connection.execute(text("SELECT 1")).scalar_one() == 1
          test_engine.dispose()
          print("Initialization script created a reachable test database.")

          redis_client = Redis.from_url(
              os.environ["REDIS_URL"],
              socket_connect_timeout=5,
              socket_timeout=5,
          )
          assert redis_client.ping() is True
          redis_client.close()
          print("Redis is reachable from the API container.")
          PY

      - name: Verify monitoring collection and dashboard
        shell: bash
        run: |
          python3 - <<'PY'
          import base64
          import json
          import os
          import time
          from urllib.error import URLError
          from urllib.parse import urlencode
          from urllib.request import Request, urlopen

          credentials = (
              "admin:" + os.environ["GRAFANA_ADMIN_PASSWORD"]
          ).encode()
          authorization = (
              "Basic " + base64.b64encode(credentials).decode()
          )

          def get_json(url, authenticated=False):
              headers = {}
              if authenticated:
                  headers["Authorization"] = authorization
              request = Request(url, headers=headers)
              with urlopen(request, timeout=5) as response:
                  return json.load(response)

          def query(base_url, expression, authenticated=False):
              parameters = urlencode({"query": expression})
              result = get_json(
                  base_url + "/api/v1/query?" + parameters,
                  authenticated=authenticated,
              )
              assert result["status"] == "success"
              return result["data"]["result"]

          def verify():
              result = query(
                  "http://127.0.0.1:9090",
                  'up{job="ecommerce-api"}',
              )
              assert len(result) == 1, "API scrape target missing"
              assert float(result[0]["value"][1]) == 1, (
                  "API scrape target is down"
              )

              result = query(
                  "http://127.0.0.1:9090",
                  'ecommerce_http_requests_total{'
                  'job="ecommerce-api",route="/health",'
                  'status_code="200"}',
              )
              assert result, "Application metrics not collected"
              assert float(result[0]["value"][1]) >= 1

              datasource = get_json(
                  "http://127.0.0.1:3000/api/datasources/uid/prometheus",
                  authenticated=True,
              )
              assert datasource["type"] == "prometheus"
              assert datasource["url"] == "http://prometheus:9090"

              dashboard = get_json(
                  "http://127.0.0.1:3000/apis/dashboard.grafana.app/"
                  "v1/namespaces/default/dashboards/ecommerce-api",
                  authenticated=True,
              )
              assert dashboard["metadata"]["name"] == "ecommerce-api"
              panels = dashboard["spec"]["panels"]
              assert {panel["id"] for panel in panels} == {1, 2, 3, 4}
              assert all(
                  panel["datasource"]["uid"] == "prometheus"
                  for panel in panels
              )

              result = query(
                  "http://127.0.0.1:3000/api/datasources/"
                  "proxy/uid/prometheus",
                  'up{job="ecommerce-api"}',
                  authenticated=True,
              )
              assert len(result) == 1
              assert float(result[0]["value"][1]) == 1, (
                  "Grafana cannot query the API scrape metric"
              )

          deadline = time.monotonic() + 90
          while True:
              try:
                  verify()
                  break
              except (AssertionError, URLError) as error:
                  if time.monotonic() >= deadline:
                      raise
                  print(
                      "Waiting for monitoring readiness:",
                      type(error).__name__,
                      flush=True,
                  )
                  time.sleep(3)

          print(
              "Verified API scraping, stored request metrics, "
              "dashboard provisioning, and Grafana-to-Prometheus queries."
          )
          PY

      - name: Show service status and logs
        if: always()
        run: |
          docker compose --env-file .env.compose ps -a
          docker compose --env-file .env.compose logs --no-color --tail=100

      - name: Remove CI containers and volumes
        if: always()
        run: |
          docker compose --env-file .env.compose down --volumes --remove-orphans

  publish-image:
    name: Publish versioned API image
    needs:
      - test-and-build
      - compose-smoke-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set image name
        id: image
        shell: bash
        run: |
          echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish API image
        id: publish
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Record published version
        shell: bash
        env:
          IMAGE_NAME: ${{ steps.image.outputs.name }}
          IMAGE_DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          {
            echo "Published API image:"
            echo
            echo "${IMAGE_NAME}@${IMAGE_DIGEST}"
          } >> "$GITHUB_STEP_SUMMARY"
